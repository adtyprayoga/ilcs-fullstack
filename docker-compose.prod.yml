name: ${COMPOSE_PROJECT_NAME:-musicpedia-prod}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicpedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-musicpedia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER wajib diisi di .env.production}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD wajib diisi di .env.production}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${BACKEND_IMAGE:-musicpedia-backend:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Kredensial hanya masuk lewat environment Compose, tidak pernah
      # ditulis di Dockerfile atau dibakar ke image.
      DATABASE_URL: postgres://${POSTGRES_USER:-musicpedia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.production}@db:5432/${POSTGRES_DB:-musicpedia}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env.production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@musicpedia.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUDIO_DIR: /data/audio
      FFMPEG_PATH: /usr/bin/ffmpeg
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_PRODUCTION: ${MIDTRANS_PRODUCTION:-false}
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    volumes:
      - audio:/data/audio
    # Sengaja tidak menunggu RabbitMQ: API dan situs tetap jalan saat broker
    # mati; registrasi hanya mencatat kegagalan publish (ADR 0005).
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Worker Email Selamat Datang dari image backend yang sama. Menunggu backend
  # sehat (migrasi sudah dijalankan backend) dan menolak start tanpa kredensial
  # Mailtrap atau APP_URL.
  worker:
    image: ${BACKEND_IMAGE:-musicpedia-backend:latest}
    restart: unless-stopped
    command: ["node", "backend/src/worker.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-musicpedia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.production}@db:5432/${POSTGRES_DB:-musicpedia}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET wajib diisi di .env.production}
      AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      MAILTRAP_SMTP_HOST: ${MAILTRAP_SMTP_HOST:-sandbox.smtp.mailtrap.io}
      MAILTRAP_SMTP_PORT: ${MAILTRAP_SMTP_PORT:-2525}
      MAILTRAP_SMTP_USER: ${MAILTRAP_SMTP_USER:-}
      MAILTRAP_SMTP_PASS: ${MAILTRAP_SMTP_PASS:-}
      EMAIL_PENGIRIM: ${EMAIL_PENGIRIM:-MusicPedia <no-reply@musicpedia.id>}
      APP_URL: ${APP_URL:-}
    # Healthcheck image menembak port 3000 milik API; worker tidak membuka port.
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${WEB_IMAGE:-musicpedia-web:latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Kosong untuk 443 standar; isi ":8443" bila HTTPS_PORT bukan 443 agar
      # redirect HTTP tetap menunjuk port yang benar saat uji lokal.
      HTTPS_REDIRECT_PORT: ${HTTPS_REDIRECT_PORT:-}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1/api/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  audio:
  rabbitmq:
